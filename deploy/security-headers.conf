# En-tetes de securite de Prisme Studio, inclus dans chaque bloc location de nginx.conf
# (nginx n'herite pas des add_header du bloc server dans un bloc location qui en declare).
# frame-ancestors : domaines autorises a integrer Prisme dans une iframe.
#   Pour un portail interne : frame-ancestors 'self' https://portail.entreprise.fr
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob: data: https:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
