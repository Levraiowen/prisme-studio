# docker compose -f deploy/docker-compose.yml up -d   puis http://localhost:8080
services:
  prisme-studio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: prisme-studio:4.0.0
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # jeux de donnees internes mis a disposition (lecture seule), chargeables par ?data=/data/fichier.csv
    volumes:
      - ./data:/usr/share/nginx/html/data:ro
    restart: unless-stopped
