# Prisme Studio : hebergement statique durci (nginx non privilegie, port 8080).
# L'application ne dispose d'aucun serveur applicatif : les donnees restent dans le navigateur de l'utilisateur.
# Les en-tetes de securite (CSP, frame-ancestors...) sont dans security-headers.conf.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # compression des ressources texte
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json text/csv text/plain image/svg+xml;

    # la page et le service worker sont versionnes dans leur contenu : toujours revalides
    location ~ ^/(index\.html|sw\.js)$ {
        include /etc/nginx/prisme/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # jeux de donnees mis a disposition par l'equipe data (optionnel) : /data/xxx.csv, chargeable par ?data=/data/xxx.csv
    location /data/ {
        include /etc/nginx/prisme/security-headers.conf;
        add_header Cache-Control "no-store" always;
        types { text/csv csv; text/tab-separated-values tsv; application/json json; application/vnd.apache.parquet parquet;
                application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx; application/vnd.ms-excel xls; }
        default_type application/octet-stream;
    }

    # sonde de disponibilite pour l'orchestrateur
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / {
        include /etc/nginx/prisme/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
